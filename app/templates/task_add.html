{% extends "base.html" %} {% block content %}
<div class="max-w-lg xs:w-[90%] mx-auto">
  <h1 class="text-2xl font-bold mb-4">Agregar Nueva Tarea</h1>
  <form
    method="POST"
    class="w-[80%] md:w-[70%] mx-auto bg-white p-6 rounded-lg shadow-slate-700 shadow-md"
  >
    <div class="mb-4">
      <label class="block text-gray-700 font-bold mb-2" for="title"
        >Título</label
      >
      <input
        type="text"
        name="title"
        id="title"
        class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      />
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 font-bold mb-2" for="description"
        >Descripción</label
      >
      <textarea
        name="description"
        id="description"
        class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        rows="5"
        required
      ></textarea>
    </div>
    <div class="md:flex sm:grid sm:grid-cols-1 sm:gap-3 space-x-4">
      <button
        type="submit"
        class="flex items-center w-full md:w-auto  sm:py-1 sm:gap-2 bg-blue-500 text-white my-2 px-4 py-2 rounded hover:bg-blue-600 disabled:bg-blue-300"
      >
        <svg
          class="w-5 h-5 mr-2"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 4v16m8-8H4"
          ></path>
        </svg>
        Guardar
      </button>
      <a
        href="{{ url_for('index') }}"
        class="flex items-center w-full md:w-auto sm:py-1 sm:gap-2 bg-gray-500 text-white my-2 px-4 py-2 rounded hover:bg-gray-600"
      >
        <svg
          class="w-5 h-5 mr-2"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
        Cancelar
      </a>
    </div>
  </form>
</div>
{% endblock %}
