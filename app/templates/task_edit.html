{% extends "base.html" %} {% block content %}
<div class="max-w-lg mx-auto">
  <h1 class="text-2xl font-bold mb-4">Editar Tarea: {{ task.id }}</h1>
  <form method="POST" class="bg-white p-6 rounded-lg shadow">
    <div class="mb-4">
      <label class="block text-gray-700 font-bold mb-2" for="title"
        >Título</label
      >
      <input
        type="text"
        name="title"
        id="title"
        value="{{ task.title }}"
        class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      />
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 font-bold mb-2" for="description"
        >Nueva Descripción (se agregará al historial)</label
      >
      <textarea
        name="description"
        id="description"
        class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        rows="5"
      ></textarea>
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 font-bold mb-2" for="status"
        >Estado</label
      >
   <select name="status" id="status" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="creada" {% if task.status == 'creada' %}selected{% endif %}>Creada</option>
                <option value="en proceso" {% if task.status == 'en proceso' %}selected{% endif %}>En Proceso</option>
                <option value="en espera" {% if task.status == 'en espera' %}selected{% endif %}>En Espera</option>
                <option value="cancelado" {% if task.status == 'cancelado' %}selected{% endif %}>Cancelado</option>
                <option value="terminado" {% if task.status == 'terminado' %}selected{% endif %}>Terminado</option>
            </select>
    </div>
    <div class="mb-4">
      <p><strong>Historial Actual:</strong></p>
      <pre class="bg-gray-100 p-4 rounded whitespace-pre-wrap">
{{ task.description or 'Sin historial' }}</pre
      >
    </div>
    <div class="md:flex  md:space-x-4">
      <button
        type="submit"
        class="flex items-center w-full md:w-auto mx-auto my-3 md:m-y-0 bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 disabled:bg-green-300"
      >
        <svg
          class="w-5 h-5 mr-2"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M5 13l4 4L19 7"
          ></path>
        </svg>
        Actualizar
      </button>
      <a
        href="{{ url_for('index') }}"
        class="flex items-center w-full md:w-auto mx-auto my-3 md:m-y-0 bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600"
      >
        <svg
          class="w-5 h-5 mr-2"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
        Cancelar
      </a>
    </div>
  </form>
</div>
{% endblock %}
